<script>const layoutHeatmap=(()=>{const module={exports:{}};
'use strict'

// The bins are daily percentage points, shared by both markets.
const GAIN = ['#592e38', '#773641', '#963d48', '#b4434f', '#c34653']
const LOSS = ['#25453f', '#25594d', '#216b57', '#1a7c60', '#188361']
const FLAT = '#3b4657'
const UNKNOWN = '#303947'

function number(value) {
  if (typeof value !== 'number' && (typeof value !== 'string' || !value.trim())) return NaN
  return Number(value)
}

function appearance(change) {
  if (!Number.isFinite(change)) return { fill: UNKNOWN, ink: '#ffffff' }
  if (change === 0) return { fill: FLAT, ink: '#ffffff' }
  const amount = Math.abs(change)
  const step = amount < 1 ? 0 : amount < 3 ? 1 : amount < 5 ? 2 : amount < 7 ? 3 : 4
  const fill = (change > 0 ? GAIN : LOSS)[step]
  return { fill, ink: '#ffffff' }
}

function changeText(change) {
  if (!Number.isFinite(change)) return '—'
  const sign = change > 0 ? '+' : change < 0 ? '−' : ''
  return sign + Math.abs(change).toFixed(2) + '%'
}

function labelLevel(w, h) {
  if (w >= 78 && h >= 64) return 'full'
  if (w >= 51 && h >= 36) return 'normal'
  if (w >= 25 && h >= 18) return 'small'
  return 'tiny'
}

function fitName(name, symbol, width, level) {
  if (level === 'tiny') return { labelName: '', labelSize: 0 }
  const preferred = level === 'small' ? 10 : level === 'normal' ? 12 : 14
  const minimum = level === 'small' ? 9 : level === 'normal' ? 10 : 12
  const available = width - (level === 'small' ? 4 : 8)
  const letters = Array.from(name || symbol)
  const cost = c => c.charCodeAt(0) <= 127 ? 0.59 : 1
  const fittingSize = chars => Math.min(preferred,
    Math.floor(available / Math.max(1, chars.reduce((sum, c) => sum + cost(c), 0))))
  const nameSize = fittingSize(letters)
  if (nameSize >= minimum) return { labelName: letters.join(''), labelSize: nameSize }
  const ticker = Array.from(symbol)
  const tickerSize = fittingSize(ticker)
  if (ticker.length && tickerSize >= minimum) return { labelName: symbol, labelSize: tickerSize }
  const max = available / minimum
  let length = 0
  let text = ''
  for (const c of letters) {
    if (length + cost(c) + 0.8 > max) break
    text += c
    length += cost(c)
  }
  return { labelName: text ? text + '…' : (letters[0] || ''), labelSize: minimum }
}

function capText(cap) {
  if (cap >= 1e12) return (cap / 1e12).toFixed(2) + '万亿'
  if (cap >= 1e8) return (cap / 1e8).toFixed(2) + '亿'
  if (cap >= 1e4) return (cap / 1e4).toFixed(2) + '万'
  return String(cap)
}

function tile(item, x, y, w, h) {
  const row = item.row
  const change = number(row.changePct)
  const name = String(row.name || row.symbol || '')
  const symbol = String(row.symbol || '')
  const level = labelLevel(w, h)
  const changeLabel = changeText(change)
  const movement = !Number.isFinite(change) ? '涨跌暂无数据' :
    change === 0 ? '平盘' : (change > 0 ? '上涨' : '下跌') + Math.abs(change).toFixed(2) + '%'
  return Object.assign({}, row, appearance(change), fitName(name, symbol, w, level), {
    symbol, name, x, y, w, h, changePct: Number.isFinite(change) ? change : null,
    marketCap: item.cap, level, changeLabel,
    ariaLabel: name + ' ' + symbol + '，总市值' + capText(item.cap) + '，' + movement
  })
}

// With descending areas, only the largest and smallest tile can be the
// worst-shaped member of a strip. All coordinates stay in CSS pixels.
function aspect(first, last, sum, side) {
  const thickness = sum / side
  const squared = thickness * thickness
  return Math.max(first / squared, squared / last)
}

function layoutHeatmap(rows, width, height) {
  const w = number(width)
  const h = number(height)
  if (!Array.isArray(rows) || !(w > 0 && h > 0) || !Number.isFinite(w * h)) return []
  const items = rows.map((row, index) => ({ row, index, cap: row ? number(row.marketCap) : NaN }))
    .filter(item => Number.isFinite(item.cap) && item.cap > 0)
    .sort((a, b) => b.cap - a.cap || a.index - b.index)
  if (!items.length) return []

  // Normalizing before adding also supports very large market-cap values.
  const largest = items[0].cap
  const totalWeight = items.reduce((sum, item) => sum + item.cap / largest, 0)
  for (const item of items) item.area = (item.cap / largest) / totalWeight * (w * h)
  const result = []
  let left = 0
  let top = 0
  let start = 0
  while (start < items.length) {
    const remainingWidth = Math.max(0, w - left)
    const remainingHeight = Math.max(0, h - top)
    const upright = remainingWidth >= remainingHeight
    const side = upright ? remainingHeight : remainingWidth
    let end = start + 1

function themes(){
  const cards=market.sectors.map(o=>button('detail','sector:'+o.id,'<span class="atlas-symbol" aria-hidden="true">'+esc(o.icon)+'</span><span class="atlas-quote"><strong>'+esc(o.name)+'</strong><span class="atlas-pill '+tone(o.changePct)+'">'+(o.changePct>0?'▲ ':o.changePct<0?'▼ ':'• ')+pct(o.changePct)+'</span></span>','atlas-card')).join('');
  return '<section class="atlas-list">'+sectionTitle('globe','美股盘前涨跌','<span class="unit">'+market.sectors.length+' 个板块</span>')+'<div class="atlas-grid">'+cards+'</div></section>'+referenceNote();
}
function referenceNote(){return '<p class="page-footnote">数据来自参考页面，截图未标注该栏目的独立行情时间。</p>'}
function metals(){return `<section class="page-panel panel">${sectionTitle('globe','全球经济数据')}<div class="section-grid simple">${market.macro.map(o=>quoteCard('macro',o)).join('')}</div></section><section class="page-panel panel">${sectionTitle('gem','工业金属')}<div class="wide-grid">${market.metals.map(o=>quoteCard('metal',o)).join('')}</div></section>${referenceNote()}`}
function filteredRows(){
  const m=state.market,q=state.query.trim().toLocaleLowerCase(),rows=rankMeta(m).rows||[];
  return rows.filter(o=>(!state.savedOnly||favorites.has(m+':'+o.symbol))&&(!q||[o.name,o.symbol,o.nameEn].some(t=>String(t||'').toLocaleLowerCase().includes(q))));
}
function listBody(){
  const rows=filteredRows();
  return rows.map((o,i)=>stockRow(state.market,o,i,true)).join('')||`<div class="empty">${state.query?'未找到匹配的股票':state.savedOnly?'当前市场还没有自选股票':'暂无排行快照'}</div>`;
}
function sourceLink(src,url){
  const str=String(url||'');
  return /^https?:\/\//i.test(str)?`<a href="${esc(str)}" target="_blank" rel="noopener noreferrer">${esc(src)}</a>`:esc(src);
}
function dateRange(pack){
  if(!pack.quoteDate)return '来源未标注';
  return pack.earliestQuoteDate&&pack.earliestQuoteDate!==pack.quoteDate?pack.earliestQuoteDate+' 至 '+pack.quoteDate:pack.quoteDate;
}
function ranking(){
  const m=state.market,r=rankMeta(m);
  return `<p class="scope"><strong>${m==='CN'?'A 股':'美股'} · 总市值前 50</strong>${esc(r.scope||'按市值从高到低排序。')} ${webQuotes.enabled?'名单随站点快照更新，名单内按最新可用市值排序。':''}<br>名单来源 ${sourceLink(r.source||'待接入',r.sourceUrl)}　采集日期 ${esc(captureDate(r)||'未提供')}　交易日期 ${esc(dateRange(r))}</p><section class="panel full-rank"><div class="rank-tools">${marketSwitch()}<label class="search">${icon('search',15)}<input id="rankSearch" aria-label="搜索股票名称或代码" placeholder="股票名称或代码" value="${esc(state.query)}" spellcheck="false"></label>${button('filterSaved','','仅看自选','checked'+(state.savedOnly?' on':''))}</div>${rankBreadth(r.rows||[])}${labels(m,true)}<div id="rankBody">${listBody()}</div></section>`;
}
function profile(){
  const favs=[...favorites].map(k=>entryMap.get(k)).filter(Boolean);
  const faveList=favs.map(e=>`<div class="favorite-row">${button('detail',e.key,`<span class="row-name">${esc(e.item.name)}</span><span class="row-symbol">${esc(e.item.symbol||groupName(e))}</span>`)}${button('favorite',e.key,icon('star',17,true),'iconbtn active','移出自选 '+e.item.name)}</div>`).join('');
  return `<div class="settings"><div class="profile-card"><span class="brand-emblem">${icon('cube',28)}</span><h2>方寸看盘</h2><p>市场行情观察工具</p><div class="text-action">${icon('star',15,true)} 已收藏 ${favs.length} 项</div></div><div><section class="panel" id="watchlist">${sectionTitle('star','我的自选',`<span class="summary-number">${favs.length}</span>`)}${faveList||'<p class="empty">暂无自选。在股票或基金详情中点击「加入自选」。</p>'}</section><section class="panel terms">${sectionTitle('book','数据说明')}<div class="info-body"><p>${esc(market.snapshot.note)} 市值榜使用独立的数据来源，两个市场的统计范围和行情日期分别展示在榜单中。</p><h3>本地收藏</h3><p>自选保存于当前浏览器。清除浏览器数据后需要重新添加。</p><h3>风险提示</h3><p>快照用于个人行情观察。交易决策请以交易所和官方披露为准。</p></div></section></div></div>`;
}
function groupName(e){return {indicator:'市场指标',fund:'盘前基金',sector:'美股主题板块',macro:'全球经济数据',metal:'工业金属',benchmark:'美股上市 ETF',stock:e.market==='US'?'美股':'A 股'}[e.group]}
function renderDetail(k,open=true){
  const e=entryMap.get(k);if(!e)return;
  openKey=k;
  const navQuote=e.group==='fund'&&state.fundMode==='close'?market.fundClose[e.item.id]:null;
  const o=navQuote?{...e.item,...navQuote,symbol:navQuote.code}:e.item,r=e.group==='stock'?rankMeta(e.market):null;
  const entries=r?[['市值排名',`#${e.rank}`],['股价',price(o.price)+' '+currency(r.currency)],['总市值',cap(o.marketCap)+' '+currency(r.currency)],['采集日期',captureDate(r)||'未提供'],['交易日期',o.quoteDate||r.quoteDate||'来源未标注'],['报价时间',o.stamp?o.stamp+(e.market==='CN'?' 北京时间':' 美东时间'):'请见交易日期'],['数据来源',o.feedName||r.source||'未提供']]:e.group==='benchmark'||o.stamp?[['交易代码',o.symbol],['行情价',finite(o.price)?price(o.price)+' 美元':'—'],['报价时间',o.stamp?o.stamp+' 美东时间':'尚未收到报价'],['行情来源','腾讯行情']]:navQuote?[
    ['份额类别',navQuote.shareClass],['单位净值',navQuote.netValue.toFixed(4)],['净值日期',navQuote.date],['数据来源','新浪财经']
  ]:[
    ...(o.value?[['参考值',o.value]]:[]),
    ['快照时间',['indicator','fund'].includes(e.group)?market.snapshot.asOf:'未标注'],['数据来源',market.snapshot.source]
  ];
  const fav=favorites.has(k);
  document.getElementById('dialogInner').innerHTML=`<div class="dialog-pad"><div class="dialog-top"><span class="eyebrow">QUOTE DETAIL</span>${button('close','',icon('close',18),'iconbtn','关闭详情')}</div><h2 id="detailTitle">${esc(o.name)}</h2><div class="dialog-sub">${esc([navQuote?'基金收盘净值':groupName(e),o.symbol].filter(Boolean).join(' · '))}</div><div class="detail-quote num ${tone(o.changePct)}">${pct(o.changePct)}</div><div class="detail-label">${o.changePct==null?'暂无涨跌数据':(navQuote?'净值日涨跌幅':o.stamp?'行情涨跌幅':'快照涨跌幅')}</div><dl class="details-list">${entries.map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl><div class="detail-actions">${button('favorite',k,fav?'移出自选':'加入自选','primary')}</div></div>`;
  dialog.setAttribute('aria-labelledby','detailTitle');
  if(open&&!dialog.open)dialog.showModal();
}
function render(){
  const renderers={home,sectors,dragon,leaders,ranks:ranking,mine:profile};
  main.innerHTML=heading()+quoteStrip()+renderers[state.page]();
  updateQuoteStrip();
  if(webQuotes.enabled)document.querySelector('.offline').textContent=['home','ranks','sectors'].includes(state.page)?'行情看板':state.page==='mine'?'本机自选':'披露数据';
  dock.innerHTML=nav.filter(t=>t[0]!=='mine').map(t=>`<button data-act="page" data-id="${t[0]}" class="${t[0]===state.page?'current':''}" ${t[0]===state.page?'aria-current="page"':''}>${icon(t[4],19)}<span>${t[1]}</span></button>`).join('');
  document.title=nav.find(t=>t[0]===state.page)[2]+' · 方寸看盘';
  watchHeatmap();
}
function go(page){if(!nav.some(t=>t[0]===page))return;state.page=page;state.query='';render();tickQuotes();window.scrollTo(0,0)}
document.addEventListener('click',ev=>{
  const act=ev.target.closest('[data-act]');if(!act)return;
  const {act:a,id}=act.dataset;
  if(a==='refreshQuotes')tickQuotes(true);
  if(a==='page')go(id);
  if(a==='saved')go('mine');
  if(a==='dragonToggle'){state.expandedDragon=state.expandedDragon===id?null:id;render()}
  if(a==='market'&&['CN','US'].includes(id)){state.market=id;state.query='';render();tickQuotes()}
  if(a==='sectorMode'&&['theme','macro'].includes(id)){state.sectorMode=id;render()}
  if(a==='fundMode'){state.fundMode=id;render()}
  if(a==='fund'){state.fundTab=id;render()}
  if(a==='detail')renderDetail(id);
  if(a==='favorite')switchFavorite(id);
  if(a==='close')dialog.close();
  if(a==='filterSaved'){state.savedOnly=!state.savedOnly;render()}
});
document.addEventListener('input',ev=>{if(ev.target.id==='rankSearch'){state.query=ev.target.value;document.querySelector('#rankBody').innerHTML=listBody()}});
dialog.addEventListener('close',()=>{openKey=null});
dialog.addEventListener('click',ev=>{if(ev.target===dialog)dialog.close()});
function readLegacyLink(){
  const oldTab=new URLSearchParams(location.search).get('tab');
  if(oldTab==='metals'||location.hash==='#metals'){
    state.page='sectors';
    state.sectorMode='macro';
  }
}
readLegacyLink();
window.addEventListener('hashchange',()=>{readLegacyLink();render()});
document.querySelector('#brandmark').innerHTML=icon('bars',27,true);
document.querySelector('#savedmark').innerHTML=icon('person',19);
render();
startQuotes();
</script>
</body>
</html>
